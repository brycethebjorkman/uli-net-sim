[General]
network = uav_rid.rid_network.BasicUav

scheduler-class = "omnetpp::cRealTimeScheduler"

*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# Mobility trail visualization
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 500

**.radioVisualizer.displayTransmissionState = false
**.radioVisualizer.displayReceptionState = false

# Disable radio medium drawing (INET 4+: departures/arrivals; not displayTransmissions/Receptions)
*.visualizer.*.mediumVisualizer.displaySignals = false
*.visualizer.*.mediumVisualizer.displaySignalDepartures = false
*.visualizer.*.mediumVisualizer.displaySignalArrivals = false
*.visualizer.canvasVisualizer.mediumVisualizer.typename = ""
*.suppressQtenvWirelessAnimations = true


# ==============================================================================
# Spoofing-aware planner scenario.
#
# 5 hosts, 2 GCS modules:
#   Hosts 0-3: benign drones hovering, grouped under GCS[0] (SpoofingAwarePlanner)
#   Host 4:    spoofer drone following a waypoint path (CascadedPidController +
#              PositionOffsetSpoofer), monitored by GCS[1] (no Python)
#
# GCS[0] receives beacons from hosts 0-3 and runs the SpoofingAwarePlanner,
# which tracks per-serial RSSI statistics and can issue replanning commands.
# ==============================================================================
[Config SpoofingAwareTest]
description = "Spoofing-aware planner — 4 benign hoverers + 1 spoofer with cascaded PID"
sim-time-limit = 60s
*.numHosts = 5
*.numGcs = 2

# --- Common mobility settings (MultirotorMobility for all) ---
*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 100ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

# Standard physical parameters for all hosts
*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

*.host[*].mobility.constraintAreaMinX = -100m
*.host[*].mobility.constraintAreaMaxX = 500m
*.host[*].mobility.constraintAreaMinY = -100m
*.host[*].mobility.constraintAreaMaxY = 500m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m

# --- Hosts 0-3: benign hoverers with HoverController ---
*.host[0..3].mobility.pyClass = "pymodules.controllers.hover.HoverController"

*.host[0].mobility.initialX = 50m
*.host[0].mobility.initialY = 50m
*.host[0].mobility.initialZ = 60m

*.host[1].mobility.initialX = 250m
*.host[1].mobility.initialY = 50m
*.host[1].mobility.initialZ = 70m

*.host[2].mobility.initialX = 50m
*.host[2].mobility.initialY = 250m
*.host[2].mobility.initialZ = 80m

*.host[3].mobility.initialX = 250m
*.host[3].mobility.initialY = 250m
*.host[3].mobility.initialZ = 50m

# --- Host 4: spoofer with CascadedPidController + PositionOffsetSpoofer ---
*.host[4].mobility.pyClass = "pymodules.controllers.cascaded_pid.CascadedPidController"
*.host[4].mobility.initialX = 150m
*.host[4].mobility.initialY = 150m
*.host[4].mobility.initialZ = 60m
*.host[4].mobility.waypointScript = xml("<movement id='4'><set x='150' y='150' z='60' speed='8'/><moveto x='250' y='150' z='80'/><moveto x='250' y='250' z='60'/><moveto x='150' y='250' z='70'/></movement>")
*.host[4].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.position_offset.PositionOffsetSpoofer"

# --- Beacon settings ---
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

# Stagger spoofer beacon so it arrives after benign beacons
*.host[4].wlan[0].mgmt.beaconOffset = 0.5s

# --- GCS[0]: SpoofingAwarePlanner monitoring benign hosts 0-3 ---
*.host[0].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.host[1].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.host[2].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.host[3].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0 1 2 3"
*.gcs[0].pyClass = "pymodules.planners.spoofing_aware.SpoofingAwarePlanner"
*.gcs[0].tickInterval = 2s
*.gcs[0].sendControlCommands = true

# --- GCS[1]: monitors spoofer host 4 (no Python — just receives reports) ---
*.host[4].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[1]"
*.gcs[1].federateIndices = "4"

# --- Recording ---
*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true
