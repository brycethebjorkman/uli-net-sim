[General]
network = uav_rid.rid_network.BasicUav

scheduler-class = "omnetpp::cRealTimeScheduler"

*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# Mobility trail visualization
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 500

# Disable transmission visualization for cleaner Qtenv view
*.visualizer.*.mediumVisualizer.displaySignals = false
*.visualizer.*.mediumVisualizer.displayTransmissions = false
*.visualizer.*.mediumVisualizer.displayReceptions = false

# ==============================================================================
# Spoofing-aware planning — shared idea for benign traffic
#
# Canonical geometry (see Scenario_Circle_8x1 for a clean instance):
#   • Hub C = (Cx, Cy, Cz) — arena crossing point (here ~ (250 m, 250 m, 70 m)).
#   • N benign agents placed on a horizontal circle of radius R around (Cx, Cy),
#     equally spaced in bearing: θ_k = 2π·k/N (k = 0 … N−1).
#   • Each benign leg is a straight segment from start to goal on the opposite
#     side of the circle (antipodal), so every path is a diameter: all cross at C
#     to reach the goal. Waypoints are set + single moveto (no intermediate hub node).
#   • Exactly one spoofer host (CascadedPid + position-offset RID); all other
#     MDP agents receive GCS unsafe regions + cooperative positions.
#
# Other scenarios: Scenario_Corners_4x1, Scenario_Hub_4x1 / _8x1 / _12x1, Scenario_SteepZ_8x1.
# Naming: Scenario_<layout>_<#benign>x<#spoofer> (always one spoofer here).
#
# GCS[0]: RSSI reports → spoof detection → IMM spoofer track → chance-constraint
# unsafe ellipsoid → broadcast to benign agents.
#
# Visualization: spoofer claimed-position trail; chance ellipsoid in OSG (if enabled).
#
# NMAC (SpoofingAwareGcs): proximity < 50 m (ground truth); spoofer-unsafe =
# inside ellipsoid. Vectors …_total; end scalars …_final in .sca.
# ==============================================================================

# ==============================================================================
# Scenario_Circle_8x1 — equal spacing on a circle, diameters through hub
#   N=8 benign at 45° on R=200 m about (250,250); each flies straight to the
#   antipodal point (same z=70 m). Spoofer on host 8.
# ==============================================================================
[Config Scenario_Circle_8x1]
description = "Scenario_Circle_8x1 — circle R=200m, 45° spacing, antipodal diameters through (250,250,70)"
sim-time-limit = 100s
*.numHosts = 9
*.numGcs = 1

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 50ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

*.host[*].mobility.constraintAreaMinX = -100m
*.host[*].mobility.constraintAreaMaxX = 600m
*.host[*].mobility.constraintAreaMinY = -100m
*.host[*].mobility.constraintAreaMaxY = 600m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m

*.host[0..7].mobility.pyClass = "pymodules.controllers.mdp_trajectory_planner.MdpTrajectoryPlanner"

# k=0 °: east ↔ west
*.host[0].mobility.initialX = 450m
*.host[0].mobility.initialY = 250m
*.host[0].mobility.initialZ = 70m
*.host[0].mobility.waypointScript = xml("<movement id='0'><set x='450' y='250' z='70' speed='8'/><moveto x='50' y='250' z='70'/></movement>")

# k=1: 45°
*.host[1].mobility.initialX = 391m
*.host[1].mobility.initialY = 391m
*.host[1].mobility.initialZ = 70m
*.host[1].mobility.waypointScript = xml("<movement id='1'><set x='391' y='391' z='70' speed='8'/><moveto x='109' y='109' z='70'/></movement>")

# k=2: 90°
*.host[2].mobility.initialX = 250m
*.host[2].mobility.initialY = 450m
*.host[2].mobility.initialZ = 70m
*.host[2].mobility.waypointScript = xml("<movement id='2'><set x='250' y='450' z='70' speed='8'/><moveto x='250' y='50' z='70'/></movement>")

# k=3: 135°
*.host[3].mobility.initialX = 109m
*.host[3].mobility.initialY = 391m
*.host[3].mobility.initialZ = 70m
*.host[3].mobility.waypointScript = xml("<movement id='3'><set x='109' y='391' z='70' speed='8'/><moveto x='391' y='109' z='70'/></movement>")

# k=4: 180°
*.host[4].mobility.initialX = 50m
*.host[4].mobility.initialY = 250m
*.host[4].mobility.initialZ = 70m
*.host[4].mobility.waypointScript = xml("<movement id='4'><set x='50' y='250' z='70' speed='8'/><moveto x='450' y='250' z='70'/></movement>")

# k=5: 225°
*.host[5].mobility.initialX = 109m
*.host[5].mobility.initialY = 109m
*.host[5].mobility.initialZ = 70m
*.host[5].mobility.waypointScript = xml("<movement id='5'><set x='109' y='109' z='70' speed='8'/><moveto x='391' y='391' z='70'/></movement>")

# k=6: 270°
*.host[6].mobility.initialX = 250m
*.host[6].mobility.initialY = 50m
*.host[6].mobility.initialZ = 70m
*.host[6].mobility.waypointScript = xml("<movement id='6'><set x='250' y='50' z='70' speed='8'/><moveto x='250' y='450' z='70'/></movement>")

# k=7: 315°
*.host[7].mobility.initialX = 391m
*.host[7].mobility.initialY = 109m
*.host[7].mobility.initialZ = 70m
*.host[7].mobility.waypointScript = xml("<movement id='7'><set x='391' y='109' z='70' speed='8'/><moveto x='109' y='391' z='70'/></movement>")

# --- Spoofer ---
*.host[8].mobility.pyClass = "pymodules.controllers.cascaded_pid.CascadedPidController"
*.host[8].mobility.initialX = 200m
*.host[8].mobility.initialY = 100m
*.host[8].mobility.initialZ = 65m
*.host[8].mobility.waypointScript = xml("<movement id='8'><set x='200' y='100' z='65' speed='6'/><moveto x='300' y='200' z='70'/><moveto x='200' y='350' z='65'/><moveto x='300' y='400' z='70'/></movement>")
*.host[8].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.position_offset.PositionOffsetSpoofer"

*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms
*.host[8].wlan[0].mgmt.beaconOffset = 0.5s

*.host[*].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0 1 2 3 4 5 6 7 8"
*.gcs[0].pyClass = "pymodules.planners.spoofing_aware_gcs.SpoofingAwareGcs"
*.gcs[0].tickInterval = 0.25s
*.gcs[0].sendControlCommands = true

*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true

