# Build:  docker compose build
# Shell:  docker compose run --rm uli-net-sim
# Batch:  docker compose run --rm uli-net-sim python3 datagen/run_batch.py ...
#
# The repo is mounted at /usr/uli-net-sim/uav_rid. Python deps live in /opt/uli-venv
# (PATH), so you do not need a host .venv inside the project.

services:
  uli-net-sim:
    build:
      context: .
      dockerfile: Containerfile
    image: uli-net-sim:latest
    working_dir: /usr/uli-net-sim/uav_rid
    volumes:
      - .:/usr/uli-net-sim/uav_rid
    stdin_open: true
    tty: true
