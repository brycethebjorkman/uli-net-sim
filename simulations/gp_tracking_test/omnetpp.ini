[General]
network = uav_rid.rid_network.BasicUav

scheduler-class = "omnetpp::cRealTimeScheduler"

*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# Mobility trail visualization
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 500

# Disable transmission visualization for cleaner Qtenv view
*.visualizer.*.mediumVisualizer.displaySignals = false
*.visualizer.*.mediumVisualizer.displayTransmissions = false
*.visualizer.*.mediumVisualizer.displayReceptions = false


# ==============================================================================
# GP-tracking detection with active trajectory planning.
#
# Geometry:
#   host[0] — Target transmitter, flies east-west at altitude 70m.
#   host[1] — Detector drone (MultirotorMobility + CascadedPidController).
#             Starts 150m south of the target's initial position.
#             Controlled by GCS active planner (steer commands).
#
# GCS[0] receives beacons at host[1], runs GpTrackingPlanner:
#   - on_gcs_reports: propagation GP + CUSUM detection + active trajectory planning
#
# Two configs:
#   GpTrackingHonest  — target is benign, verifies low false alarm rate
#   GpTrackingSpoofed — target spoofs position via PyTxHook (+50m offset)
# ==============================================================================


# ==============================================================================
# GpTrackingHonest — benign target, no spoofing
# ==============================================================================
[Config GpTrackingHonest]
description = "GP-tracking detector with active planning — honest target"
sim-time-limit = 120s
*.numHosts = 2
*.numGcs = 1

# Host 0: target transmitter — TurtleMobility east-west trajectory
*.host[0].typename = "DroneHost"
*.host[0].mobility.typename = "TurtleMobility"
*.host[0].mobility.updateInterval = 100ms
*.host[0].mobility.initFromDisplayString = false
# East-west flight: start at (100,200,70), fly east to (400,200,70), back west
*.host[0].mobility.turtleScript = xml("<movement><set x='100' y='200' z='70' speed='8'/><moveto x='400' y='200' z='70'/><moveto x='100' y='200' z='70'/><moveto x='400' y='200' z='70'/></movement>")

# Host 1: detector drone — MultirotorMobility, GCS-controlled
*.host[1].typename = "DroneHost"
*.host[1].mobility.typename = "MultirotorMobility"
*.host[1].mobility.initFromDisplayString = false
*.host[1].mobility.updateInterval = 50ms
*.host[1].mobility.dynamicsDt = 0.001s
*.host[1].mobility.controlDt = 0.01s
*.host[1].mobility.mass = 5kg
*.host[1].mobility.armLength = 0.5m
*.host[1].mobility.Ixx = 0.5
*.host[1].mobility.Iyy = 0.5
*.host[1].mobility.Izz = 0.8
*.host[1].mobility.pyClass = "pymodules.controllers.cascaded_pid.CascadedPidController"
*.host[1].mobility.initialX = 200m
*.host[1].mobility.initialY = 50m
*.host[1].mobility.initialZ = 50m
# Initial waypoint: hover in place until GCS sends first goto command
*.host[1].mobility.waypointScript = xml("<movement id='det'><set x='200' y='50' z='50' speed='8'/><moveto x='200' y='50' z='50'/></movement>")

*.host[1].mobility.constraintAreaMinX = -100m
*.host[1].mobility.constraintAreaMaxX = 600m
*.host[1].mobility.constraintAreaMinY = -100m
*.host[1].mobility.constraintAreaMaxY = 600m
*.host[1].mobility.constraintAreaMinZ = 0m
*.host[1].mobility.constraintAreaMaxZ = 200m

# Beacons: 1 Hz, stagger target and detector
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms
*.host[0].wlan[0].mgmt.beaconOffset = 0.0s
*.host[1].wlan[0].mgmt.beaconOffset = 0.5s

# GCS: detector drone forwards reports, GCS runs GP-tracking planner
*.host[1].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "1"
*.gcs[0].pyClass = "pymodules.planners.gp_tracking.GpTrackingPlanner"
*.gcs[0].sendControlCommands = true

*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true


# ==============================================================================
# GpTrackingSpoofed — target spoofs position via Python TX hook
# ==============================================================================
[Config GpTrackingSpoofed]
description = "GP-tracking detector with active planning — spoofed target"
extends = GpTrackingHonest

# Override host 0 to be a PyTxHook spoofer (claims offset position)
*.host[0].typename = "PyTxHookSpooferHost"
*.host[0].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.position_offset.PositionOffsetSpoofer"


# ==============================================================================
# PyGpTrackingTest — short regression test config (hash-based)
# ==============================================================================
[Config PyGpTrackingTest]
description = "GP-tracking regression test — 30s, 2 hosts, spoofed target"
extends = GpTrackingSpoofed
sim-time-limit = 30s
