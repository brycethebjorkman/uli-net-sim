extends = Scenario_Corners_4x1
description = "Scenario_Corners_4x1_SmoothSpoofer — corners 4x1 with smoothed spoofer trajectory"

# Spoofer host is index 4 in Scenario_Corners_4x1.
# Added intermediate waypoints to smooth turn transitions.
