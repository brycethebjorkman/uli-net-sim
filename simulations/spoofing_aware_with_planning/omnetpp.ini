*.host[*].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0 1 2 3 4 5 6 7 8"
*.gcs[0].pyClass = "pymodules.planners.spoofing_aware_gcs.SpoofingAwareGcs"
*.gcs[0].tickInterval = 0.25s
*.gcs[0].sendControlCommands = true

