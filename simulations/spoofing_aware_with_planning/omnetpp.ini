[General]
network = uav_rid.rid_network.BasicUav

scheduler-class = "omnetpp::cRealTimeScheduler"

*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# Mobility trail visualization
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 500

# Disable transmission visualization for cleaner Qtenv view
*.visualizer.*.mediumVisualizer.displaySignals = false
*.visualizer.*.mediumVisualizer.displayTransmissions = false
*.visualizer.*.mediumVisualizer.displayReceptions = false

# ==============================================================================
# Common settings shared by all spoofing-aware configs.
#
# Configs use 5 or 9 hosts + 1 GCS:
#   StarPattern / SimultaneousCrossing: hosts 0–3 benign (MDP), host 4 spoofer
#   SimultaneousCrossing8: hosts 0–7 benign (MDP), host 8 spoofer
#
# GCS[0] receives all RSSI reports, detects spoofing (multilateration + KF),
# localizes spoofer (IMM estimator), computes chance-constraint unsafe region,
# and broadcasts it to benign agents.
#
# Visualization: spoofer's claimed RID position shown as red sphere trail,
# chance-constraint ellipsoid rendered in OSG.
#
# Agents plan decentralized MDP-based trajectories per timestep to avoid
# the unsafe region and other cooperative agents while progressing to goal.
# ==============================================================================

# ==============================================================================
# Config 1: Corner-to-corner (star pattern)
#   Agents fly from corners to opposite corners, all paths cross near center.
# ==============================================================================
[Config StarPattern]
description = "Star pattern — 4 benign agents fly corner-to-corner + 1 spoofer"
sim-time-limit = 600s
*.numHosts = 5
*.numGcs = 1

# --- Common mobility settings ---
*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 50ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

*.host[*].mobility.constraintAreaMinX = -100m
*.host[*].mobility.constraintAreaMaxX = 600m
*.host[*].mobility.constraintAreaMinY = -100m
*.host[*].mobility.constraintAreaMaxY = 600m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m

*.host[0..3].mobility.pyClass = "pymodules.controllers.mdp_trajectory_planner.MdpTrajectoryPlanner"

# Host 0: (50,50) → (400,400)
*.host[0].mobility.initialX = 50m
*.host[0].mobility.initialY = 50m
*.host[0].mobility.initialZ = 60m
*.host[0].mobility.waypointScript = xml("<movement id='0'><set x='50' y='50' z='60' speed='8'/><moveto x='400' y='400' z='60'/></movement>")

# Host 1: (400,50) → (50,400)
*.host[1].mobility.initialX = 400m
*.host[1].mobility.initialY = 50m
*.host[1].mobility.initialZ = 70m
*.host[1].mobility.waypointScript = xml("<movement id='1'><set x='400' y='50' z='70' speed='8'/><moveto x='50' y='400' z='70'/></movement>")

# Host 2: (50,400) → (400,50)
*.host[2].mobility.initialX = 50m
*.host[2].mobility.initialY = 400m
*.host[2].mobility.initialZ = 80m
*.host[2].mobility.waypointScript = xml("<movement id='2'><set x='50' y='400' z='80' speed='8'/><moveto x='400' y='50' z='80'/></movement>")

# Host 3: (400,400) → (50,50)
*.host[3].mobility.initialX = 400m
*.host[3].mobility.initialY = 400m
*.host[3].mobility.initialZ = 50m
*.host[3].mobility.waypointScript = xml("<movement id='3'><set x='400' y='400' z='50' speed='8'/><moveto x='50' y='50' z='50'/></movement>")

# --- Spoofer ---
*.host[4].mobility.pyClass = "pymodules.controllers.cascaded_pid.CascadedPidController"
*.host[4].mobility.initialX = 200m
*.host[4].mobility.initialY = 100m
*.host[4].mobility.initialZ = 65m
*.host[4].mobility.waypointScript = xml("<movement id='4'><set x='200' y='100' z='65' speed='6'/><moveto x='300' y='200' z='70'/><moveto x='200' y='350' z='65'/><moveto x='300' y='400' z='70'/></movement>")
*.host[4].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.position_offset.PositionOffsetSpoofer"

# --- Beacon / GCS ---
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms
*.host[4].wlan[0].mgmt.beaconOffset = 0.5s

*.host[*].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0 1 2 3 4"
*.gcs[0].pyClass = "pymodules.planners.spoofing_aware_gcs.SpoofingAwareGcs"
*.gcs[0].tickInterval = 0.25s
*.gcs[0].sendControlCommands = true

# --- Recording ---
*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true

# ==============================================================================
# Config 2: Simultaneous crossing
#   All 4 benign agents are equidistant from a single 3D crossing point
#   (250, 250, 70) so they converge there at the same time (~t=25s).
# ==============================================================================
[Config SimultaneousCrossing]
description = "Simultaneous crossing — all 4 agents converge on (250,250,70) at ~t=25s + 1 spoofer"
sim-time-limit = 600s
*.numHosts = 5
*.numGcs = 1

# --- Common mobility settings ---
*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 50ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

*.host[*].mobility.constraintAreaMinX = -100m
*.host[*].mobility.constraintAreaMaxX = 600m
*.host[*].mobility.constraintAreaMinY = -100m
*.host[*].mobility.constraintAreaMaxY = 600m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m

*.host[0..3].mobility.pyClass = "pymodules.controllers.mdp_trajectory_planner.MdpTrajectoryPlanner"

# Host 0: west → east (horizontal), climbs to z=70 at center
*.host[0].mobility.initialX = 50m
*.host[0].mobility.initialY = 250m
*.host[0].mobility.initialZ = 40m
*.host[0].mobility.waypointScript = xml("<movement id='0'><set x='50' y='250' z='40' speed='8'/><moveto x='250' y='250' z='70'/><moveto x='450' y='250' z='100'/></movement>")

# Host 1: south → north (vertical), descends to z=70 at center
*.host[1].mobility.initialX = 250m
*.host[1].mobility.initialY = 50m
*.host[1].mobility.initialZ = 100m
*.host[1].mobility.waypointScript = xml("<movement id='1'><set x='250' y='50' z='100' speed='8'/><moveto x='250' y='250' z='70'/><moveto x='250' y='450' z='40'/></movement>")

# Host 2: southwest → northeast (diagonal), climbs to z=70 at center
*.host[2].mobility.initialX = 109m
*.host[2].mobility.initialY = 109m
*.host[2].mobility.initialZ = 30m
*.host[2].mobility.waypointScript = xml("<movement id='2'><set x='109' y='109' z='30' speed='8'/><moveto x='250' y='250' z='70'/><moveto x='391' y='391' z='110'/></movement>")

# Host 3: southeast → northwest (diagonal), descends to z=70 at center
*.host[3].mobility.initialX = 391m
*.host[3].mobility.initialY = 109m
*.host[3].mobility.initialZ = 110m
*.host[3].mobility.waypointScript = xml("<movement id='3'><set x='391' y='109' z='110' speed='8'/><moveto x='250' y='250' z='70'/><moveto x='109' y='391' z='30'/></movement>")

# --- Spoofer ---
*.host[4].mobility.pyClass = "pymodules.controllers.cascaded_pid.CascadedPidController"
*.host[4].mobility.initialX = 200m
*.host[4].mobility.initialY = 100m
*.host[4].mobility.initialZ = 65m
*.host[4].mobility.waypointScript = xml("<movement id='4'><set x='200' y='100' z='65' speed='6'/><moveto x='300' y='200' z='70'/><moveto x='200' y='350' z='65'/><moveto x='300' y='400' z='70'/></movement>")
*.host[4].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.position_offset.PositionOffsetSpoofer"

# --- Beacon / GCS ---
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms
*.host[4].wlan[0].mgmt.beaconOffset = 0.5s

*.host[*].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0 1 2 3 4"
*.gcs[0].pyClass = "pymodules.planners.spoofing_aware_gcs.SpoofingAwareGcs"
*.gcs[0].tickInterval = 0.25s
*.gcs[0].sendControlCommands = true

# --- Recording ---
*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true

# ==============================================================================
# Config 3: Eight-way simultaneous crossing
#   Eight benign agents on opposite radial pairs through (250, 250, 70), plus
#   one spoofer. Same center and structure as SimultaneousCrossing, with the
