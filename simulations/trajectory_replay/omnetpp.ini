#
# Trajectory replay — lightweight visualization of pre-recorded trajectories.
#
# Uses INET's BonnMotionMobility to replay position traces exported from
# headless simulations via scripts/vec2trace.py.  No physics, no radio,
# no Python controllers — just 3D visualization in Qtenv.
#
# Workflow:
#   1. Run headless:
#        scripts/run.sh -f simulations/controller_test/omnetpp.ini \
#            -c CascadedPidStress -r /tmp/results -q
#
#   2. Convert .vec to BonnMotion trace (output next to this INI):
#        python3 scripts/vec2trace.py /tmp/results/CascadedPidStress-#0.vec \
#            -o simulations/trajectory_replay/
#
#   3. Open this file in Qtenv, select TrajectoryReplay config, and run.
#      Edit numHosts and traceFile below to match the exported trace.
#      The traceFile path is relative to the IDE working directory.
#

[General]
network = uav_rid.rid_network.BasicUav

[Config TrajectoryReplay]
description = "Replay pre-recorded trajectories from BonnMotion trace file"

# ── Edit these to match the exported trace ──
*.numHosts = 16
*.host[*].mobility.traceFile = "CascadedPidStress.movements"

# BonnMotion 3D trace replay
*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "BonnMotionMobility"
*.host[*].mobility.is3D = true
*.host[*].mobility.nodeId = -1
*.host[*].mobility.updateInterval = 100ms

# Disable beacons — replay only
*.host[*].wlan[0].mgmt.transmitBeacon = false

# Trail visualization
*.visualizer.osgVisualizer.networkNodeVisualizer.displayModuleName = true
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 500

sim-time-limit = 180s
