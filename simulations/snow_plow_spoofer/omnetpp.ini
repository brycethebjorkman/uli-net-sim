#
# Snow plow spoofer scenarios — a spoofer claims to be further along its
# waypoint path than it really is.
#
# Three configs:
#   - SnowPlowTest:     Basic verification (no detectors)
#   - SnowPlowVsKf:     Snow plow spoofer vs online KF NIS detector
#   - SnowPlowVsCombined: Snow plow spoofer vs combined KF + MLAT detector
#
# Layout: 6 hosts on corridor-like paths in a 400m grid.
#   Host 0-3: benign federates (KF-enabled receivers)
#   Host 4:   snow plow spoofer (claims 50m ahead on path)
#   Host 5:   benign reference (same path as spoofer, no spoofing)
#

[General]
network = uav_rid.rid_network.BasicUav
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"


# ==============================================================================
# Base config: 6 hosts with TurtleMobility waypoints
# ==============================================================================
[Config SnowPlowBase]
sim-time-limit = 60s
*.numHosts = 6

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "TurtleMobility"
*.host[*].mobility.updateInterval = 100ms

*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 0.5s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

# Stagger beacons to avoid collisions
*.host[0].wlan[0].mgmt.beaconOffset = 0.00s
*.host[1].wlan[0].mgmt.beaconOffset = 0.05s
*.host[2].wlan[0].mgmt.beaconOffset = 0.10s
*.host[3].wlan[0].mgmt.beaconOffset = 0.15s
*.host[4].wlan[0].mgmt.beaconOffset = 0.25s
*.host[5].wlan[0].mgmt.beaconOffset = 0.30s

# Host 0: benign, flies east along bottom
*.host[0].mobility.turtleScript = xml("<movement><set x='50' y='50' z='50' speed='8'/><moveto x='350' y='50' z='50'/></movement>")

# Host 1: benign, flies east along top
*.host[1].mobility.turtleScript = xml("<movement><set x='50' y='350' z='50' speed='8'/><moveto x='350' y='350' z='50'/></movement>")

# Host 2: benign, flies north along left
*.host[2].mobility.turtleScript = xml("<movement><set x='50' y='50' z='60' speed='10'/><moveto x='50' y='350' z='60'/></movement>")

# Host 3: benign, flies north along right
*.host[3].mobility.turtleScript = xml("<movement><set x='350' y='50' z='60' speed='10'/><moveto x='350' y='350' z='60'/></movement>")

# Host 4: SPOOFER — L-shaped path, claims 50m ahead via snow plow
*.host[4].mobility.turtleScript = xml("<movement><set x='100' y='100' z='55' speed='10'/><moveto x='300' y='100' z='55'/><moveto x='300' y='300' z='55'/></movement>")
*.host[4].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.snow_plow.SnowPlowSpoofer"

# Host 5: benign reference — identical path to spoofer (no spoofing)
*.host[5].mobility.turtleScript = xml("<movement><set x='100' y='100' z='55' speed='10'/><moveto x='300' y='100' z='55'/><moveto x='300' y='300' z='55'/></movement>")

*.host[*].wlan[0].mgmt.statistic-recording = true


# ==============================================================================
# SnowPlowTest — basic spoofer verification (no online detectors)
# ==============================================================================
[Config SnowPlowTest]
extends = SnowPlowBase
description = "Snow plow spoofer — basic verification, no detectors"


# ==============================================================================
# SnowPlowVsKf — snow plow spoofer vs online KF NIS detector
# ==============================================================================
[Config SnowPlowVsKf]
extends = SnowPlowBase
description = "Snow plow spoofer vs online KF NIS detector"

# Use KF-enabled receivers for all benign hosts
*.host[0..3].typename = "KalmanFilterDetectHost"

# GCS with KF NIS detector
*.numGcs = 1
*.gcs[0].pyClass = "pymodules.detectors.kf_nis.KfNisDetector"
*.gcs[0].federateIndices = "0 1 2 3"
*.host[0..3].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"


# ==============================================================================
# SnowPlowVsCombined — snow plow spoofer vs combined KF + MLAT detector
# ==============================================================================
[Config SnowPlowVsCombined]
extends = SnowPlowBase
description = "Snow plow spoofer vs combined KF + MLAT online detector"

# Use KF-enabled receivers for all benign hosts
*.host[0..3].typename = "KalmanFilterDetectHost"

# GCS with combined detector
*.numGcs = 1
*.gcs[0].pyClass = "pymodules.detectors.combined.CombinedDetector"
*.gcs[0].federateIndices = "0 1 2 3"
*.host[0..3].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
