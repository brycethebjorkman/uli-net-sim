#
# Controller stress tests — 16 drones with diverse waypoint paths.
#
# Paths are arranged in a 4×4 grid (300m spacing) so each drone stays
# within its own ~250×250×100m cuboid for clean 3D visualization.
#
# Two controller variants extend the same base config:
#   - CascadedPidStress: pymodules.controllers.cascaded_pid.CascadedPidController
#   - LqrStress:         pymodules.controllers.lqr.LqrController
#
# Path catalogue (by host index):
#
#   Row 0 — Turn angle (constant speed 10 m/s, flat):
#     [0] Straight line (0° turn)
#     [1] Gentle turn (30°)
#     [2] Right-angle turn (90°)
#     [3] Sharp turn (135°)
#
#   Row 1 — Turn patterns & climb:
#     [4] U-turn (180°)
#     [5] Square (4× 90° turns)
#     [6] Gentle climb (15° slope)
#     [7] Steep climb (45° slope)
#
#   Row 2 — Descent, speed, altitude:
#     [8]  Descent (30° slope)
#     [9]  Hill profile (climb + descent)
#     [10] Slow cruise (3 m/s square)
#     [11] Fast cruise (15 m/s square)
#
#   Row 3 — Speed change & curve resolution:
#     [12] Accelerate then decelerate (3 → 15 → 3 m/s)
#     [13] Coarse arc (3 waypoints on quarter circle R=100m)
#     [14] Medium arc (7 waypoints on same quarter circle)
#     [15] Fine arc  (15 waypoints on same quarter circle)
#

[General]
network = uav_rid.rid_network.BasicUav
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"


# ==============================================================================
# Base config: 16 drones with MultirotorMobility and shared physics
# ==============================================================================
[Config ControllerStressBase]
sim-time-limit = 180s
*.numHosts = 16

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 100ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

# Uniform physical parameters — mid-size quadrotor
*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

# Constraint area covers the full 4×4 grid with margin
*.host[*].mobility.constraintAreaMinX = -50m
*.host[*].mobility.constraintAreaMaxX = 1300m
*.host[*].mobility.constraintAreaMinY = -50m
*.host[*].mobility.constraintAreaMaxY = 1300m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m

# Disable beacons — pure trajectory following test
*.host[*].wlan[0].mgmt.transmitBeacon = false

# --- Row 0: Turn angle tests (y ∈ [25, 275], z=60, speed=10) ----------------

# [0] Straight line — 0° turn, 200m segment
*.host[0].mobility.initialX = 50m
*.host[0].mobility.initialY = 150m
*.host[0].mobility.initialZ = 60m
*.host[0].mobility.waypointScript = xml("<movement id='0'>\
  <set x='50' y='150' z='60' speed='10'/>\
  <moveto x='250' y='150' z='60'/>\
</movement>")

# [1] Gentle turn — 30° heading change after 100m straight
*.host[1].mobility.initialX = 350m
*.host[1].mobility.initialY = 100m
*.host[1].mobility.initialZ = 60m
*.host[1].mobility.waypointScript = xml("<movement id='1'>\
  <set x='350' y='100' z='60' speed='10'/>\
  <moveto x='450' y='100' z='60'/>\
  <moveto x='537' y='150' z='60'/>\
</movement>")

# [2] Right-angle turn — 90° heading change (L-shape)
*.host[2].mobility.initialX = 650m
*.host[2].mobility.initialY = 50m
*.host[2].mobility.initialZ = 60m
*.host[2].mobility.waypointScript = xml("<movement id='2'>\
  <set x='650' y='50' z='60' speed='10'/>\
  <moveto x='750' y='50' z='60'/>\
  <moveto x='750' y='200' z='60'/>\
</movement>")

# [3] Sharp turn — 135° heading change (near-reversal with offset)
*.host[3].mobility.initialX = 950m
*.host[3].mobility.initialY = 50m
*.host[3].mobility.initialZ = 60m
*.host[3].mobility.waypointScript = xml("<movement id='3'>\
  <set x='950' y='50' z='60' speed='10'/>\
  <moveto x='1100' y='50' z='60'/>\
  <moveto x='1029' y='121' z='60'/>\
</movement>")

# --- Row 1: Turn patterns & climb (y ∈ [325, 575]) --------------------------

# [4] U-turn — 180° reversal
*.host[4].mobility.initialX = 50m
*.host[4].mobility.initialY = 425m
*.host[4].mobility.initialZ = 60m
*.host[4].mobility.waypointScript = xml("<movement id='4'>\
  <set x='50' y='425' z='60' speed='10'/>\
  <moveto x='225' y='425' z='60'/>\
  <moveto x='50' y='475' z='60'/>\
</movement>")

# [5] Square — 4× 90° turns, 150m sides
*.host[5].mobility.initialX = 375m
*.host[5].mobility.initialY = 375m
*.host[5].mobility.initialZ = 60m
*.host[5].mobility.waypointScript = xml("<movement id='5'>\
  <set x='375' y='375' z='60' speed='10'/>\
  <moveto x='525' y='375' z='60'/>\
  <moveto x='525' y='525' z='60'/>\
  <moveto x='375' y='525' z='60'/>\
  <moveto x='375' y='375' z='60'/>\
</movement>")

# [6] Gentle climb — 15° slope over 200m horizontal (rise 54m)
*.host[6].mobility.initialX = 650m
*.host[6].mobility.initialY = 450m
*.host[6].mobility.initialZ = 35m
*.host[6].mobility.waypointScript = xml("<movement id='6'>\
  <set x='650' y='450' z='35' speed='10'/>\
  <moveto x='850' y='450' z='89'/>\
</movement>")

# [7] Steep climb — 45° slope over 80m horizontal (rise 80m)
*.host[7].mobility.initialX = 975m
*.host[7].mobility.initialY = 450m
*.host[7].mobility.initialZ = 35m
*.host[7].mobility.waypointScript = xml("<movement id='7'>\
  <set x='975' y='450' z='35' speed='8'/>\
  <moveto x='1055' y='450' z='115'/>\
</movement>")

# --- Row 2: Descent, speed, altitude (y ∈ [625, 875]) -----------------------

# [8] Descent — 30° slope over 150m horizontal (drop 87m)
*.host[8].mobility.initialX = 50m
*.host[8].mobility.initialY = 750m
*.host[8].mobility.initialZ = 120m
*.host[8].mobility.waypointScript = xml("<movement id='8'>\
  <set x='50' y='750' z='120' speed='10'/>\
  <moveto x='200' y='750' z='33'/>\
</movement>")

# [9] Hill profile — climb 60m then descend 60m
*.host[9].mobility.initialX = 350m
*.host[9].mobility.initialY = 750m
*.host[9].mobility.initialZ = 40m
*.host[9].mobility.waypointScript = xml("<movement id='9'>\
  <set x='350' y='750' z='40' speed='10'/>\
  <moveto x='450' y='750' z='100'/>\
  <moveto x='550' y='750' z='40'/>\
</movement>")

# [10] Slow cruise — 3 m/s L-shape (tests tracking at low speed)
*.host[10].mobility.initialX = 675m
*.host[10].mobility.initialY = 675m
*.host[10].mobility.initialZ = 60m
*.host[10].mobility.waypointScript = xml("<movement id='10'>\
  <set x='675' y='675' z='60' speed='3'/>\
  <moveto x='825' y='675' z='60'/>\
  <moveto x='825' y='825' z='60'/>\
</movement>")

# [11] Fast cruise — 15 m/s L-shape (tests tracking at high speed)
*.host[11].mobility.initialX = 975m
*.host[11].mobility.initialY = 675m
*.host[11].mobility.initialZ = 60m
*.host[11].mobility.waypointScript = xml("<movement id='11'>\
  <set x='975' y='675' z='60' speed='15'/>\
  <moveto x='1125' y='675' z='60'/>\
  <moveto x='1125' y='825' z='60'/>\
</movement>")

# --- Row 3: Speed change & curve resolution (y ∈ [925, 1175]) ---------------

# [12] Speed change — 3 m/s → 15 m/s → 3 m/s over three 75m segments
*.host[12].mobility.initialX = 50m
*.host[12].mobility.initialY = 1050m
*.host[12].mobility.initialZ = 60m
*.host[12].mobility.waypointScript = xml("<movement id='12'>\
  <set x='50' y='1050' z='60' speed='3'/>\
  <moveto x='125' y='1050' z='60'/>\
  <set x='125' y='1050' z='60' speed='15'/>\
  <moveto x='200' y='1050' z='60'/>\
  <set x='200' y='1050' z='60' speed='3'/>\
  <moveto x='250' y='1050' z='60'/>\
</movement>")

# [13] Coarse arc — quarter circle R=100m, 3 waypoints
# Same geometric curve as [14] and [15], fewest control points.
# Arc center (425, 1075), sweeps from -90° to 0°.
*.host[13].mobility.initialX = 425m
*.host[13].mobility.initialY = 975m
*.host[13].mobility.initialZ = 60m
*.host[13].mobility.waypointScript = xml("<movement id='13'>\
  <set x='425.0' y='975.0' z='60' speed='10'/>\
  <moveto x='495.7' y='1004.3' z='60'/>\
  <moveto x='525.0' y='1075.0' z='60'/>\
</movement>")

# [14] Medium arc — quarter circle R=100m, 7 waypoints
# Same geometric curve as [13] and [15], moderate density.
# Arc center (725, 1075), sweeps from -90° to 0°.
*.host[14].mobility.initialX = 725m
*.host[14].mobility.initialY = 975m
*.host[14].mobility.initialZ = 60m
*.host[14].mobility.waypointScript = xml("<movement id='14'>\
  <set x='725.0' y='975.0' z='60' speed='10'/>\
  <moveto x='750.9' y='978.4' z='60'/>\
  <moveto x='775.0' y='988.4' z='60'/>\
  <moveto x='795.7' y='1004.3' z='60'/>\
  <moveto x='811.6' y='1025.0' z='60'/>\
  <moveto x='821.6' y='1049.1' z='60'/>\
  <moveto x='825.0' y='1075.0' z='60'/>\
</movement>")

# [15] Fine arc — quarter circle R=100m, 15 waypoints
# Same geometric curve as [13] and [14], highest density.
# Arc center (1025, 1075), sweeps from -90° to 0°.
*.host[15].mobility.initialX = 1025m
*.host[15].mobility.initialY = 975m
*.host[15].mobility.initialZ = 60m
*.host[15].mobility.waypointScript = xml("<movement id='15'>\
  <set x='1025.0' y='975.0' z='60' speed='10'/>\
  <moveto x='1036.2' y='975.6' z='60'/>\
  <moveto x='1047.3' y='977.5' z='60'/>\
  <moveto x='1058.0' y='980.6' z='60'/>\
  <moveto x='1068.4' y='984.9' z='60'/>\
  <moveto x='1078.2' y='990.3' z='60'/>\
  <moveto x='1087.3' y='996.8' z='60'/>\
  <moveto x='1095.7' y='1004.3' z='60'/>\
  <moveto x='1103.2' y='1012.7' z='60'/>\
  <moveto x='1109.7' y='1021.8' z='60'/>\
  <moveto x='1115.1' y='1031.6' z='60'/>\
  <moveto x='1119.4' y='1042.0' z='60'/>\
  <moveto x='1122.5' y='1052.7' z='60'/>\
  <moveto x='1124.4' y='1063.8' z='60'/>\
  <moveto x='1125.0' y='1075.0' z='60'/>\
</movement>")


# ==============================================================================
# CascadedPidStress — all drones use CascadedPidController
# ==============================================================================
[Config CascadedPidStress]
extends = ControllerStressBase
description = "Controller stress test — CascadedPidController, 16 diverse paths"
*.host[*].mobility.pyClass = "pymodules.controllers.cascaded_pid.CascadedPidController"


# ==============================================================================
# LqrStress — all drones use LqrController
# ==============================================================================
[Config LqrStress]
extends = ControllerStressBase
description = "Controller stress test — LqrController, 16 diverse paths"
*.host[*].mobility.pyClass = "pymodules.controllers.lqr.LqrController"
