[General]
network = uav_rid.rid_network.BasicUav

*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# Mobility trail visualization
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 500


# ==============================================================================
# Hover test: 2 drones with default hover thrust (T = m*g), should stay put.
# ==============================================================================
[Config HoverTest]
description = "Two drones hovering at different altitudes with MultirotorMobility"
sim-time-limit = 10s
*.numHosts = 2

# Use MultirotorMobility for all hosts
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 100ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

# Physical parameters
*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

# Host 0: hover at (100, 100, 50)
*.host[0].mobility.initialX = 100m
*.host[0].mobility.initialY = 100m
*.host[0].mobility.initialZ = 50m

# Host 1: hover at (200, 200, 80)
*.host[1].mobility.initialX = 200m
*.host[1].mobility.initialY = 200m
*.host[1].mobility.initialZ = 80m

# Beacon settings
*.host[*].typename = "DroneHost"
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

# Record everything
*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true

# Constrain area so we can detect if drones drift
*.host[*].mobility.constraintAreaMinX = -500m
*.host[*].mobility.constraintAreaMaxX = 500m
*.host[*].mobility.constraintAreaMinY = -500m
*.host[*].mobility.constraintAreaMaxY = 500m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m


# ==============================================================================
# Freefall test: 1 drone with zero thrust, should fall under gravity.
# Use this to verify dynamics integration produces correct z(t) = z0 - 0.5*g*t^2
# ==============================================================================
[Config FreefallTest]
description = "Single drone with zero thrust — verifies gravity produces correct freefall"
sim-time-limit = 3s
*.numHosts = 1

*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 10ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

# Start at 100m altitude
*.host[0].mobility.initialX = 0m
*.host[0].mobility.initialY = 0m
*.host[0].mobility.initialZ = 100m

# Zero thrust — pure freefall under gravity
# Expected: z(t) = 100 - 0.5 * 9.81 * t^2
#   t=1s -> z=95.095, t=2s -> z=80.38, t=3s -> z=55.855
*.host[0].mobility.mass = 5kg
*.host[0].mobility.defaultThrust = 0

*.host[*].typename = "DroneHost"
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true

*.host[*].mobility.constraintAreaMinZ = -1000m
*.host[*].mobility.constraintAreaMaxZ = 1000m


# ==============================================================================
# Python hover controller: PD position-hold with initial velocity perturbation.
# Exercises MultirotorMobility Python controller hook (compute()).
# ==============================================================================
[Config PyHoverTest]
description = "Python PD hover controller — drone should hold position despite perturbation"
sim-time-limit = 10s
*.numHosts = 2

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 100ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s
*.host[*].mobility.mass = 5kg
*.host[*].mobility.armLength = 0.5m
*.host[*].mobility.Ixx = 0.5
*.host[*].mobility.Iyy = 0.5
*.host[*].mobility.Izz = 0.8

# Python hover controller
*.host[*].mobility.pyClass = "pymodules.controllers.hover.HoverController"

# Host 0 at (100, 100, 50) with initial velocity perturbation
*.host[0].mobility.initialX = 100m
*.host[0].mobility.initialY = 100m
*.host[0].mobility.initialZ = 50m
*.host[0].mobility.initialVx = 2.0
*.host[0].mobility.initialVy = -1.0

# Host 1 at (200, 200, 80) at rest
*.host[1].mobility.initialX = 200m
*.host[1].mobility.initialY = 200m
*.host[1].mobility.initialZ = 80m

*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true

*.host[*].mobility.constraintAreaMinX = -500m
*.host[*].mobility.constraintAreaMaxX = 500m
*.host[*].mobility.constraintAreaMinY = -500m
*.host[*].mobility.constraintAreaMaxY = 500m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxZ = 200m


# ==============================================================================
# Python spoofer: TX hook adds fixed position offset.
# Exercises RidBeaconMgmt Python TX hook (on_tx()).
# ==============================================================================
[Config PySpooferTest]
description = "Python TX hook position offset spoofer — verifies beacon modification"
sim-time-limit = 5s
*.numHosts = 2

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "StationaryMobility"
*.host[*].mobility.initFromDisplayString = false

*.host[0].mobility.initialX = 100m
*.host[0].mobility.initialY = 100m
*.host[0].mobility.initialZ = 50m

*.host[1].mobility.initialX = 200m
*.host[1].mobility.initialY = 200m
*.host[1].mobility.initialZ = 50m

# Host 1 is spoofer: claims position offset by (50, 50, 0)
*.host[1].wlan[0].mgmt.pyTxClass = "pymodules.spoofers.position_offset.PositionOffsetSpoofer"

*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

*.host[*].wlan[0].mgmt.statistic-recording = true


# ==============================================================================
# Python detector: GCS serial impersonation detector.
# Host 3 spoofs host 0's serial number. GCS[0] monitors host 0 and detects
# impersonation when it receives beacons with serial=0 at host 0.
# Exercises: GCS on_reports() hook and RX forwarding.
# ==============================================================================
[Config PyDetectorTest]
description = "GCS serial impersonation detector — spoofer copies detector host's serial"
sim-time-limit = 10s
*.numHosts = 4
*.numGcs = 3

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "StationaryMobility"
*.host[*].mobility.initFromDisplayString = false

# 4 hosts in a square
*.host[0].mobility.initialX = 0m
*.host[0].mobility.initialY = 0m
*.host[0].mobility.initialZ = 50m
*.host[1].mobility.initialX = 200m
*.host[1].mobility.initialY = 0m
*.host[1].mobility.initialZ = 50m
*.host[2].mobility.initialX = 0m
*.host[2].mobility.initialY = 200m
*.host[2].mobility.initialZ = 50m
*.host[3].mobility.initialX = 200m
*.host[3].mobility.initialY = 200m
*.host[3].mobility.initialZ = 50m

# Host 3 is spoofer: uses host 0's serial number
*.host[3].wlan[0].mgmt.serialNumber = 0

# Stagger beacons so spoofer transmits last (after detector host)
*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms
*.host[0].wlan[0].mgmt.beaconOffset = 0.0s
*.host[1].wlan[0].mgmt.beaconOffset = 0.1s
*.host[2].wlan[0].mgmt.beaconOffset = 0.2s
*.host[3].wlan[0].mgmt.beaconOffset = 0.5s

# GCS[0] monitors detector host 0 — runs impersonation detector
*.host[0].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0"
*.gcs[0].pyClass = "pymodules.detectors.serial_impersonation.SerialImpersonationDetector"

# GCS[1] monitors benign hosts 1-2 (no detector)
*.host[1].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[1]"
*.host[2].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[1]"
*.gcs[1].federateIndices = "1 2"

# GCS[2] monitors spoofer host 3 (no detector)
*.host[3].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[2]"
*.gcs[2].federateIndices = "3"

*.host[*].wlan[0].mgmt.statistic-recording = true


# ==============================================================================
# Python planner: GCS periodic tick issues random altitude commands.
# Exercises GcsModule on_tick() + command forwarding + HoverController target_z.
# Four drones with different physical parameters show varied responses.
# ==============================================================================
[Config PyPlannerTest]
description = "GCS random altitude planner — 4 drones with varied dynamics respond to altitude commands"
sim-time-limit = 20s
*.numHosts = 4
*.numGcs = 1

*.host[*].typename = "DroneHost"
*.host[*].mobility.typename = "MultirotorMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateInterval = 100ms
*.host[*].mobility.dynamicsDt = 0.001s
*.host[*].mobility.controlDt = 0.01s

# Python hover controller (receives target_z from GCS commands)
*.host[*].mobility.pyClass = "pymodules.controllers.hover.HoverController"

# Host 0: light nimble drone at (100, 100, 50)
*.host[0].mobility.initialX = 100m
*.host[0].mobility.initialY = 100m
*.host[0].mobility.initialZ = 50m
*.host[0].mobility.mass = 2kg
*.host[0].mobility.armLength = 0.3m
*.host[0].mobility.Ixx = 0.1
*.host[0].mobility.Iyy = 0.1
*.host[0].mobility.Izz = 0.2

# Host 1: standard drone at (200, 100, 70)
*.host[1].mobility.initialX = 200m
*.host[1].mobility.initialY = 100m
*.host[1].mobility.initialZ = 70m
*.host[1].mobility.mass = 5kg
*.host[1].mobility.armLength = 0.5m
*.host[1].mobility.Ixx = 0.5
*.host[1].mobility.Iyy = 0.5
*.host[1].mobility.Izz = 0.8

# Host 2: heavy sluggish drone at (100, 200, 90)
*.host[2].mobility.initialX = 100m
*.host[2].mobility.initialY = 200m
*.host[2].mobility.initialZ = 90m
*.host[2].mobility.mass = 12kg
*.host[2].mobility.armLength = 0.7m
*.host[2].mobility.Ixx = 1.5
*.host[2].mobility.Iyy = 1.5
*.host[2].mobility.Izz = 2.5

# Host 3: asymmetric drone at (200, 200, 40)
*.host[3].mobility.initialX = 200m
*.host[3].mobility.initialY = 200m
*.host[3].mobility.initialZ = 40m
*.host[3].mobility.mass = 3.5kg
*.host[3].mobility.armLength = 0.4m
*.host[3].mobility.Ixx = 0.3
*.host[3].mobility.Iyy = 0.6
*.host[3].mobility.Izz = 0.4

# Disable transmission visualization for cleaner Qtenv view
*.visualizer.*.mediumVisualizer.displaySignals = false
*.visualizer.*.mediumVisualizer.displayTransmissions = false
*.visualizer.*.mediumVisualizer.displayReceptions = false

*.host[*].wlan[0].mgmt.transmitBeacon = true
*.host[*].wlan[0].mgmt.beaconInterval = 1s
*.host[*].wlan[0].mgmt.startupJitter = 0ms

# GCS runs random altitude planner with 2s tick interval
*.host[*].wlan[0].mgmt.gcsModulePath = "^.^.^.gcs[0]"
*.gcs[0].federateIndices = "0 1 2 3"
*.gcs[0].pyClass = "pymodules.planners.random_altitude.RandomAltitudePlanner"
*.gcs[0].tickInterval = 2s
*.gcs[0].sendControlCommands = true

*.host[*].mobility.statistic-recording = true
*.host[*].wlan[0].mgmt.statistic-recording = true


# ==============================================================================
# Extends PyPlannerTest with non-zero initial velocities, angles, and angular
# rates.  Each drone starts in a distinct flight state so the controller must
# actively stabilise before tracking altitude commands.
# ==============================================================================
[Config PyPlannerPerturbed]
extends = PyPlannerTest

# Host 0 (light): banking right with forward speed
*.host[0].mobility.initialVx = 3
*.host[0].mobility.initialVy = -1
*.host[0].mobility.initialVz = 0.5
*.host[0].mobility.initialPhi = 0.15
*.host[0].mobility.initialTheta = 0.05
*.host[0].mobility.initialPsi = 0.3
*.host[0].mobility.initialP = 0.1
*.host[0].mobility.initialQ = -0.05
*.host[0].mobility.initialR = 0.08

# Host 1 (standard): nose-down descent with yaw rotation
*.host[1].mobility.initialVx = -2
*.host[1].mobility.initialVy = 1.5
*.host[1].mobility.initialVz = -1
*.host[1].mobility.initialPhi = -0.1
*.host[1].mobility.initialTheta = 0.2
*.host[1].mobility.initialPsi = -0.5
*.host[1].mobility.initialP = -0.08
*.host[1].mobility.initialQ = 0.12
*.host[1].mobility.initialR = -0.15

# Host 2 (heavy): slow roll with slight climb
*.host[2].mobility.initialVx = 1
*.host[2].mobility.initialVy = 2
*.host[2].mobility.initialVz = 0.3
*.host[2].mobility.initialPhi = 0.25
*.host[2].mobility.initialTheta = -0.1
*.host[2].mobility.initialPsi = 1.0
*.host[2].mobility.initialP = 0.2
*.host[2].mobility.initialQ = 0.06
*.host[2].mobility.initialR = 0.1

# Host 3 (asymmetric): aggressive pitch with lateral drift
*.host[3].mobility.initialVx = -1.5
*.host[3].mobility.initialVy = -2.5
*.host[3].mobility.initialVz = -0.8
*.host[3].mobility.initialPhi = -0.2
*.host[3].mobility.initialTheta = -0.25
*.host[3].mobility.initialPsi = 2.0
*.host[3].mobility.initialP = -0.15
*.host[3].mobility.initialQ = -0.1
*.host[3].mobility.initialR = 0.2
