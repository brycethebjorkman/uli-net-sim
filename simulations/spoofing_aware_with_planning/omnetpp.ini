# ==============================================================================
# Scenario_Corners_4x1_SmoothSpoofer — corners baseline with smoother spoofer arc
#   Inherits Scenario_Corners_4x1 and only changes the spoofer waypoints so
#   heading/curvature changes are more gradual than the sharp zig-zag.
# ==============================================================================
